<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classement — EduConcoursCI</title>
    <meta
      name="description"
      content="Classement général des meilleurs scores QCM sur EduConcoursCI. Entraîne-toi et grimpe dans le classement !"
    />
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main class="container" style="max-width: 720px; padding: calc(var(--navbar-h) + 40px) 20px 60px;">
      <div style="text-align: center; margin-bottom: 32px;">
        <h1>🏆 Classement général</h1>
        <p style="color: var(--gris-texte);">
          Les meilleures moyennes QCM sur la plateforme (minimum 3 tentatives).
        </p>
      </div>

      <div id="zone-classement">
        <div class="skeleton" style="height: 60px; border-radius: 10px; margin-bottom: 10px;"></div>
        <div class="skeleton" style="height: 60px; border-radius: 10px; margin-bottom: 10px;"></div>
        <div class="skeleton" style="height: 60px; border-radius: 10px;"></div>
      </div>

      <div style="text-align: center; margin-top: 32px;">
        <a href="/quiz.html" class="btn btn--primaire">Faire un QCM pour progresser →</a>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="/js/layout.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          const { classement } = await window.API.Progression.classement();
          const zone = document.getElementById("zone-classement");

          if (classement.length === 0) {
            zone.innerHTML = `<p style="text-align:center;color:var(--gris-texte);padding:40px 0;">Pas encore assez de tentatives pour établir un classement. Sois parmi les premiers !</p>`;
            return;
          }

          const MEDAILLES = ["🥇", "🥈", "🥉"];
          zone.innerHTML = classement
            .map((c) => `
      <div style="display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--blanc);border-radius:var(--radius-md);margin-bottom:10px;box-shadow:var(--ombre-sm);">
        <div style="font-size:1.3rem;font-weight:900;width:36px;text-align:center;color:var(--gris-texte);">${MEDAILLES[c.rang - 1] || c.rang}</div>
        <div style="flex:1;">
          <div style="font-weight:700;">${c.nom}</div>
          <div style="font-size:0.78rem;color:var(--gris-texte);">${c.totalTentatives} QCM complétés</div>
        </div>
        <div style="font-weight:900;color:var(--vert);font-size:1.1rem;">${c.moyenne}%</div>
      </div>`)
            .join("");
        } catch (err) {
          document.getElementById("zone-classement").innerHTML = `<p style="text-align:center;color:#dc2626;">Erreur de chargement : ${err.message}</p>`;
        }
      });
    </script>
  </body>
</html>
