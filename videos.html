<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidéos de formation — ProInsertion CI</title>
  <meta name="description" content="Cours en vidéo pour préparer les concours CI. Formateurs ivoiriens, explications claires.">
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProInsertion CI" />
    <meta property="og:title" content="Vidéos de formation — ProInsertion CI" />
    <meta property="og:description" content="Cours en vidéo pour préparer les concours CI. Formateurs ivoiriens, explications claires." />
    <meta property="og:image" content="https://proinsertionci.netlify.app/assets/og-image.jpg" />
    <meta property="og:url" content="https://proinsertionci.netlify.app/videos.html" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vidéos de formation — ProInsertion CI" />
    <meta name="twitter:description" content="Cours en vidéo pour préparer les concours CI. Formateurs ivoiriens, explications claires." />
    <meta name="twitter:image" content="https://proinsertionci.netlify.app/assets/og-image.jpg" />
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/recherche.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .videos-grille { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
    .modal-video   { position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;padding:20px; }
    .modal-video.ouvert { display:flex; }
    .modal-video__contenu { width:100%;max-width:860px;position:relative; }
    .modal-video__iframe  { width:100%;aspect-ratio:16/9;border:none;border-radius:14px;background:#000; }
    .modal-video__fermer  { position:absolute;top:-44px;right:0;background:rgba(255,255,255,0.15);border:none;border-radius:50%;width:38px;height:38px;color:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center; }
    @media(max-width:900px){ .videos-grille{grid-template-columns:1fr 1fr;} }
    @media(max-width:600px){ .videos-grille{grid-template-columns:1fr;} }
  </style>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A6B3C" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  </head>
<body>

<div id="site-header"></div>
        

<div class="page-header page-header--standard">
  <div class="container">
    <h1><span data-icone="video" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span> Vidéos</h1>
    <p>Cours en vidéo et actualités pour préparer votre concours.</p>
  </div>
</div>

<main style="padding:calc(var(--navbar-h) + 36px) 0 60px;background:var(--gris-clair);">
  <div class="container">

<!-- Onglets catégories -->
<div class="filtres scroll-x" id="onglets-videos" style="margin-bottom:24px;">
  <button class="filtre-btn actif" data-cat="" onclick="changerCat(this,'')"><span data-icone="video" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span> Toutes</button>
</div>

<!-- Recherche -->
<input
  type="text"
  id="recherche-video"
  placeholder="Rechercher une vidéo..."
  style="width:100%;padding:10px 14px;margin-bottom:18px;border:1.5px solid var(--gris-bordure);border-radius:var(--radius-md);font-size:0.9rem;font-family:inherit;outline:none;box-sizing:border-box;background:var(--blanc);"
/>

<!-- Tri + compteur -->
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
  <span style="font-size:0.88rem;color:var(--gris-texte);font-weight:600;" id="compteur-videos">Chargement…</span>
  <select id="tri-videos" onchange="filtrerVideos()" style="padding:8px 14px;border:1.5px solid var(--gris-bordure);border-radius:var(--radius-md);font-size:0.85rem;outline:none;background:var(--blanc);">
    <option value="recent">Plus récentes</option>
    <option value="vues">Plus vues</option>
    <option value="gratuit">Gratuites d'abord</option>
  </select>
</div>

<!-- Grille vidéos -->
<div class="videos-grille" id="grille-videos">
  <div class="skeleton" style="height:240px;border-radius:16px;"></div>
  <div class="skeleton" style="height:240px;border-radius:16px;"></div>
  <div class="skeleton" style="height:240px;border-radius:16px;"></div>
  <div class="skeleton" style="height:240px;border-radius:16px;"></div>
  <div class="skeleton" style="height:240px;border-radius:16px;"></div>
  <div class="skeleton" style="height:240px;border-radius:16px;"></div>
</div>
<div id="zone-plus" style="text-align:center;margin:28px 0 8px;"></div>

  </div>
</main>

<!-- Modal lecteur vidéo -->

<div class="modal-video" id="modal-video" onclick="fermerVideo(event)">
  <div class="modal-video__contenu">
    <button class="modal-video__fermer" onclick="fermerModalVideo()"><span data-icone="croix" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></button>
    <iframe class="modal-video__iframe" id="iframe-video" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    <div style="margin-top:14px;color:#fff;">
      <div style="font-weight:800;font-size:1.1rem;" id="modal-video-titre"></div>
      <div style="opacity:0.6;font-size:0.88rem;margin-top:4px;" id="modal-video-cat"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="/js/layout.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/recherche.js"></script>
    <script src="/js/api.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/main.js"></script>

<script>
const PAR_PAGE = 24;
let videosAffichees = [];
let totalVideos     = 0;
let catActive       = "";
let chargement      = false;
let minuteur        = null;
let numRequete      = 0;

document.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("recherche-video")?.addEventListener("input", () => {
    clearTimeout(minuteur);
    minuteur = setTimeout(() => chargerVideos(true), 350);
  });
  await chargerVideos(true);
});

async function chargerVideos(remiseAZero) {
  if (chargement && !remiseAZero) return;
  chargement = true;
  const moi = ++numRequete;
  const decalage = remiseAZero ? 0 : videosAffichees.length;
  try {
    const params = { limit: PAR_PAGE, offset: decalage, tri: document.getElementById("tri-videos")?.value || "recent" };
    const q = (document.getElementById("recherche-video")?.value || "").trim();
    if (q) params.q = q;
    if (catActive) params.categorie = catActive;
    const data = await window.API.Videos.liste(params);
    if (moi !== numRequete) return;
    totalVideos = data.total || 0;
    videosAffichees = remiseAZero ? (data.videos || []) : videosAffichees.concat(data.videos || []);

    if (data.categories) {
      const onglets = document.getElementById("onglets-videos");
      onglets.innerHTML = `<button class="filtre-btn ${catActive ? "" : "actif"}" data-cat="" onclick="changerCat(this,'')">🎬 Toutes</button>` +
        data.categories.map(c => `<button class="filtre-btn ${c === catActive ? "actif" : ""}" data-cat="${echapperHtml(c)}" onclick="changerCat(this,${echapperHtml(JSON.stringify(c))})">${echapperHtml(c)}</button>`).join("");
    }
    afficherVideos(videosAffichees);
  } catch {
    window.afficherToast("Erreur de chargement des vidéos.", "erreur");
  } finally {
    if (moi === numRequete) chargement = false;
  }
}

function changerCat(btn, cat) {
  catActive = cat;
  document.querySelectorAll(".filtres .filtre-btn").forEach(b => b.classList.remove("actif"));
  btn.classList.add("actif");
  chargerVideos(true);
}

function filtrerVideos() { chargerVideos(true); }

function majBoutonPlus() {
  const z = document.getElementById("zone-plus");
  if (!z) return;
  const reste = totalVideos - videosAffichees.length;
  z.innerHTML = reste > 0
    ? `<button class="btn btn--outline-vert" onclick="chargerVideos(false)">Voir plus de vidéos (${reste} restante${reste>1?"s":""})</button>`
    : "";
}

function afficherVideos(liste) {
  majBoutonPlus();
  document.getElementById("compteur-videos").textContent = `${totalVideos} vidéo${totalVideos!==1?"s":""} trouvée${totalVideos!==1?"s":""}`;
  const grille  = document.getElementById("grille-videos");
  const session = window.Auth?.getSession();

  if (liste.length === 0) {
    grille.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--gris-texte);">
        <div style="font-size:3rem;margin-bottom:12px;">📭</div>
        <div style="font-weight:700;font-size:1.1rem;">Aucune vidéo trouvée</div>
      </div>`; return;
  }

  grille.innerHTML = liste.map(v => {
    const verrouille = v.verrouille || (v.premium && (!session || !session.premium));
    const miniature  = v.miniature || "";
    return `
      <div class="card-video">
        <div class="card-video__miniature" onclick="${verrouille ? "demanderPremium()" : `lireVideo('${v.youtube_id||""}','${v.url||""}',${echapperHtml(JSON.stringify(v.titre))},'${echapperHtml(v.categorie||"")}')`}">
          ${miniature
            ? `<img src="${miniature}" alt="${echapperHtml(v.titre)}" loading="lazy">`
            : `<div style="height:100%;background:linear-gradient(135deg,#1A1A2E,#7B2FBE);display:flex;align-items:center;justify-content:center;font-size:2.5rem;">🎬</div>`
          }
          <div class="card-video__play">
            <div class="card-video__play-btn">${verrouille ? "🔒" : "▶"}</div>
          </div>
          ${v.duree ? `<div class="card-video__duree">${v.duree}</div>` : ""}
        </div>
        <div class="card-video__corps">
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
            <span class="badge badge--violet">${echapperHtml(v.categorie||"Général")}</span>
            ${v.premium ? '<span class="badge badge--premium">⭐ Premium</span>' : '<span class="badge badge--gratuit">🆓 Gratuit</span>'}
          </div>
          <div class="card-video__titre">${echapperHtml(v.titre)}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
            <span style="font-size:0.78rem;color:var(--gris-texte);">👁 ${(v.vues||0).toLocaleString("fr-CI")} vues</span>
            ${verrouille
              ? `<a href="/boutique.html" class="btn btn--orange btn--sm">⭐ Débloquer</a>`
              : `<button onclick="lireVideo('${v.youtube_id||""}','${v.url||""}',${echapperHtml(JSON.stringify(v.titre))},'${echapperHtml(v.categorie||"")}')" class="btn btn--violet btn--sm" style="background:var(--violet);color:#fff;border:none;">▶ Regarder</button>`
            }
          </div>
        </div>
      </div>`;
  }).join("");
}

function lireVideo(ytId, url, titre, categorie) {
  if (!ytId && !url) { window.afficherToast("Lien vidéo non disponible.", "erreur"); return; }

  const src = ytId
    ? `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`
    : url;

  document.getElementById("iframe-video").src        = src;
  document.getElementById("modal-video-titre").textContent  = titre;
  document.getElementById("modal-video-cat").textContent    = categorie;
  document.getElementById("modal-video").classList.add("ouvert");
  document.body.style.overflow = "hidden";
}

function fermerVideo(e) {
  if (e.target === document.getElementById("modal-video")) fermerModalVideo();
}

function fermerModalVideo() {
  document.getElementById("iframe-video").src = "";
  document.getElementById("modal-video").classList.remove("ouvert");
  document.body.style.overflow = "";
}

function ouvrirLien(url) {
  if (url) window.open(url, "_blank");
}

function demanderPremium() {
  window.afficherToast("Cette vidéo est réservée aux abonnés Premium.", "warn");
  setTimeout(() => window.location.href = "/boutique.html", 1500);
}

// Fermeture avec Escape
document.addEventListener("keydown", e => {
  if (e.key === "Escape") fermerModalVideo();
});

document.getElementById("recherche-video")?.addEventListener("input",
  window.Utils?.debounce?.(filtrerVideos, 300) || filtrerVideos
);
</script>

</body>
</html>
