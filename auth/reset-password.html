<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réinitialiser le mot de passe — EduConcoursCI</title>
    <meta
      name="description"
      content="Choisis un nouveau mot de passe pour ton compte EduConcoursCI."
    />
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <style>
      .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--gris-fond, #f7f8fa);
      }
      .auth-card {
        width: 100%;
        max-width: 440px;
        padding: 40px 32px;
      }
      .auth-card__logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 24px;
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: 1.4rem;
        text-decoration: none;
        color: inherit;
      }
      .auth-card__titre {
        text-align: center;
        margin-bottom: 4px;
      }
      .auth-card__sous-titre {
        text-align: center;
        color: var(--gris-texte, #666);
        margin-bottom: 24px;
        font-size: 0.95rem;
      }
      .auth-card__pied {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="card auth-card">
        <a href="/" class="auth-card__logo">
          <span><span data-icone="diplome" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></span>
          <span>Edu<span style="color: var(--vert, #1a8c4a)">Concours</span>CI</span>
        </a>

        <h1 class="auth-card__titre">Nouveau mot de passe</h1>
        <p class="auth-card__sous-titre" id="sous-titre">
          Choisis un nouveau mot de passe pour ton compte.
        </p>

        <div id="erreur-reset" class="form-erreur hidden"></div>

        <!-- Formulaire (masqué si le lien est invalide/absent) -->
        <form id="form-reset" novalidate>
          <div class="form-groupe">
            <label class="form-label" for="password">Nouveau mot de passe</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="6 caractères minimum"
              autocomplete="new-password"
              minlength="6"
              data-toggle-oeil
              required
            />
          </div>

          <div class="form-groupe">
            <label class="form-label" for="confirm">Confirmer le mot de passe</label>
            <input
              type="password"
              id="confirm"
              name="confirm"
              class="form-input"
              placeholder="Retape le nouveau mot de passe"
              autocomplete="new-password"
              minlength="6"
              data-toggle-oeil
              required
            />
          </div>

          <button type="submit" class="btn btn--primaire btn--full" id="btn-reset">
            Réinitialiser mon mot de passe
          </button>
        </form>

        <!-- Confirmation de succès -->
        <div id="confirmation-reset" class="hidden" style="text-align: center;">
          <div style="font-size: 2.4rem; margin-bottom: 12px;">✅</div>
          <p style="color: var(--gris-texte, #666); font-size: 0.95rem; line-height: 1.7; margin-bottom: 20px;">
            Ton mot de passe a été réinitialisé avec succès.
          </p>
          <a href="/auth/login.html" class="btn btn--primaire btn--full">
            Se connecter
          </a>
        </div>

        <p class="auth-card__pied">
          <a href="/auth/login.html" style="color: var(--vert, #1a8c4a); font-weight: 600;">
            ← Retour à la connexion
          </a>
        </p>
      </div>
    </div>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script>
      const token = new URLSearchParams(window.location.search).get("token");
      const erreur = document.getElementById("erreur-reset");

      if (!token) {
        document.getElementById("form-reset").classList.add("hidden");
        document.getElementById("sous-titre").textContent =
          "Ce lien de réinitialisation est invalide.";
        erreur.textContent =
          "Aucun token trouvé dans le lien. Refais une demande depuis la page \"Mot de passe oublié\".";
        erreur.classList.remove("hidden");
      }

      document.getElementById("form-reset").addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = document.getElementById("password").value;
        const confirm  = document.getElementById("confirm").value;
        const btn = document.getElementById("btn-reset");
        erreur.classList.add("hidden");

        if (password.length < 6) {
          erreur.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
          erreur.classList.remove("hidden");
          return;
        }
        if (password !== confirm) {
          erreur.textContent = "Les deux mots de passe ne correspondent pas.";
          erreur.classList.remove("hidden");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Réinitialisation en cours…";
        try {
          await window.API.Auth.resetPassword(token, password);
          document.getElementById("form-reset").classList.add("hidden");
          document.getElementById("confirmation-reset").classList.remove("hidden");
        } catch (err) {
          erreur.textContent = err.message || "Une erreur est survenue.";
          erreur.classList.remove("hidden");
          btn.disabled = false;
          btn.textContent = "Réinitialiser mon mot de passe";
        }
      });
    </script>
  </body>
</html>
