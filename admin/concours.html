<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion Concours — Admin EduConcoursCI</title>
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body style="background: var(--gris-clair)">
    <nav
      class="navbar"
      style="
        background: #0a1628;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      "
    >
      <div class="navbar__inner">
        <a href="/admin/index.html" class="navbar__logo" style="color: #fff"
          ><div
            class="navbar__logo-icon"
            style="background: rgba(255, 255, 255, 0.1)"
          >
            <span data-icone="parametres" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span>
          </div>
          <span style="color: #fff">EduConcoursCI Admin</span></a
        >
        <button
          onclick="window.Auth?.deconnecter?.()"
          class="btn btn--gris btn--sm"
        >
          Déconnexion
        </button>
      </div>
    </nav>

    <div style="padding-top: var(--navbar-h)">
      <div class="admin-layout">
        <aside class="admin-sidebar">
          <div class="admin-sidebar__header">
            <div class="admin-sidebar__logo"><span data-icone="parametres" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span> Admin Panel</div>
          </div>
          <div class="admin-sidebar__section">Dashboard</div>
          <a href="/admin/index.html" class="admin-sidebar__lien"
            ><span class="admin-sidebar__icone"><span data-icone="graphique" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></span> Dashboard</a
          >
          <div class="admin-sidebar__section">Contenu</div>
          <a href="/admin/concours.html" class="admin-sidebar__lien actif"
            ><span class="admin-sidebar__icone"><span data-icone="institution" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></span> Concours</a
          >
          <a href="/admin/pdfs.html" class="admin-sidebar__lien"
            ><span class="admin-sidebar__icone"><span data-icone="document" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></span> PDFs</a
          >
          <a href="/admin/videos.html" class="admin-sidebar__lien"
            ><span class="admin-sidebar__icone"><span data-icone="video" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></span> Vidéos</a
          >
          <a href="/admin/qcm.html" class="admin-sidebar__lien"
            ><span class="admin-sidebar__icone"><span data-icone="quiz" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></span> QCM</a
          >
          <a href="/admin/emploi.html" class="admin-sidebar__lien"
            ><span class="admin-sidebar__icone"><span data-icone="portefeuille" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></span> Emploi</a
          >
          <div class="admin-sidebar__section">Utilisateurs</div>
          <a href="/admin/abonnes.html" class="admin-sidebar__lien"
            ><span class="admin-sidebar__icone"><span data-icone="utilisateurs" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></span> Abonnés</a
          >
          <a href="/admin/paiements.html" class="admin-sidebar__lien"
            ><span class="admin-sidebar__icone"><span data-icone="paiement" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></span> Paiements</a
          >
          <a href="/admin/notifications.html" class="admin-sidebar__lien"
            ><span class="admin-sidebar__icone"><span data-icone="cloche" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></span> Notifications</a
          >
          <div class="admin-sidebar__section">Système</div>
          <a href="/admin/parametres.html" class="admin-sidebar__lien"
            ><span class="admin-sidebar__icone"><span data-icone="parametres" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></span> Paramètres</a
          >
          <a href="/" class="admin-sidebar__lien"
            ><span class="admin-sidebar__icone"><span data-icone="monde" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span></span> Voir le site</a
          >
        </aside>

        <main class="admin-contenu">
          <div class="admin-topbar">
            <div>
              <div class="admin-topbar__titre"><span data-icone="institution" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span> Gestion des Concours</div>
              <div class="admin-topbar__sous" id="compteur-conc">
                Chargement…
              </div>
            </div>
            <button
              onclick="ouvrirAjout()"
              class="btn btn--primaire"
            >
              + Ajouter un concours
            </button>
          </div>

          <div
            style="
              display: flex;
              gap: 12px;
              margin-bottom: 20px;
              flex-wrap: wrap;
            "
          >
            <input
              type="text"
              id="rech-conc"
              placeholder="🔍 Rechercher…"
              oninput="filtrerConcours()"
              style="
                padding: 10px 14px;
                border: 1.5px solid var(--gris-bordure);
                border-radius: var(--radius-md);
                font-size: 0.88rem;
                outline: none;
                width: 220px;
              "
            />
            <select
              id="fil-statut-conc"
              onchange="filtrerConcours()"
              style="
                padding: 10px 14px;
                border: 1.5px solid var(--gris-bordure);
                border-radius: var(--radius-md);
                font-size: 0.88rem;
                outline: none;
                background: var(--blanc);
              "
            >
              <option value="">Tous les statuts</option>
              <option value="ouvert">🔴 En cours</option>
              <option value="à venir">🔵 À venir</option>
              <option value="fermé">⚫ Fermé</option>
              <option value="résultats">🏆 Résultats publiés</option>
            </select>
            <select
              id="fil-acc-conc"
              onchange="filtrerConcours()"
              style="
                padding: 10px 14px;
                border: 1.5px solid var(--gris-bordure);
                border-radius: var(--radius-md);
                font-size: 0.88rem;
                outline: none;
                background: var(--blanc);
              "
            >
              <option value="">Tous les accès</option>
              <option value="false">🆓 Gratuits</option>
              <option value="true">⭐ Premium</option>
            </select>
          </div>

          <div class="admin-tableau-wrap">
            <table class="admin-tableau">
              <thead>
                <tr>
                  <th>Titre</th>
                  <th>Organisme</th>
                  <th>Catégorie</th>
                  <th>Statut</th>
                  <th>Clôture</th>
                  <th>Places</th>
                  <th>Accès</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="tbody-conc">
                <tr>
                  <td
                    colspan="8"
                    style="
                      text-align: center;
                      padding: 40px;
                      color: var(--gris-texte);
                    "
                  >
                    Chargement…
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal Ajout / Modification -->

    <div class="modal-overlay" id="modal-add-concours">
      <div class="modal" style="max-width: 640px">
        <div class="modal__header">
          <div class="modal__titre" id="modal-conc-titre">
            <span data-icone="plus" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span> Ajouter un concours
          </div>
          <button
            class="modal__fermer"
            onclick="fermerModal('modal-add-concours')"
          >
            <span data-icone="croix" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span>
          </button>
        </div>
        <div class="modal__corps">
          <div class="form-groupe">
            <label class="form-label">Titre <span>*</span></label
            ><input
              type="text"
              id="conc-titre"
              class="form-input"
              placeholder="Ex: Concours de la Fonction Publique 2026"
            />
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
            <div class="form-groupe">
              <label class="form-label">Organisme <span>*</span></label>
              <input
                type="text"
                id="conc-organisme"
                class="form-input"
                placeholder="Ex: Fonction Publique"
              />
            </div>
            <div class="form-groupe">
              <label class="form-label">Catégorie <span>*</span></label>
              <input
                type="text"
                id="conc-categorie"
                class="form-input"
                placeholder="Ex: Administration, Sécurité, Enseignement…"
              />
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
            <div class="form-groupe">
              <label class="form-label">Statut <span>*</span></label>
              <select id="conc-statut" class="form-input">
                <option value="ouvert">🔴 En cours</option>
                <option value="à venir">🔵 À venir</option>
                <option value="fermé">⚫ Fermé</option>
                <option value="résultats">🏆 Résultats publiés</option>
              </select>
            </div>
            <div class="form-groupe">
              <label class="form-label">Niveau requis</label>
              <select id="conc-niveau" class="form-input">
                <option value="">—</option>
                <option value="CEPE">CEPE</option>
                <option value="BEPC">BEPC</option>
                <option value="BAC">BAC</option>
                <option value="BAC+2">BAC+2</option>
                <option value="Licence">Licence</option>
              </select>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
            <div class="form-groupe">
              <label class="form-label">Date d'ouverture</label>
              <input type="date" id="conc-ouverture" class="form-input" />
            </div>
            <div class="form-groupe">
              <label class="form-label">Date de clôture</label>
              <input type="date" id="conc-cloture" class="form-input" />
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
            <div class="form-groupe">
              <label class="form-label">Frais d'inscription (FCFA)</label>
              <input
                type="number"
                id="conc-frais"
                class="form-input"
                placeholder="0"
                min="0"
              />
            </div>
            <div class="form-groupe">
              <label class="form-label">Places disponibles</label>
              <input
                type="number"
                id="conc-places"
                class="form-input"
                placeholder="Ex: 600"
                min="0"
              />
            </div>
          </div>
          <div class="form-groupe">
            <label class="form-label">Conditions de candidature</label>
            <textarea
              id="conc-conditions"
              class="form-textarea"
              placeholder="Conditions à remplir pour candidater…"
              rows="2"
            ></textarea>
          </div>
          <div class="form-groupe">
            <label class="form-label">Pièces à fournir</label>
            <input
              type="text"
              id="conc-pieces"
              class="form-input"
              placeholder="Séparées par des virgules : CNI, Extrait de naissance, CV…"
            />
          </div>
          <div class="form-groupe">
            <label class="form-label">Centres de composition</label>
            <input
              type="text"
              id="conc-centres"
              class="form-input"
              placeholder="Séparés par des virgules : Abidjan, Bouaké, Yamoussoukro…"
            />
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
            <div class="form-groupe">
              <label class="form-label">Accès</label>
              <select id="conc-premium" class="form-input">
                <option value="false">🆓 Gratuit</option>
                <option value="true">⭐ Premium</option>
              </select>
            </div>
            <div class="form-groupe">
              <label class="form-label">Couleur (badge)</label>
              <input
                type="color"
                id="conc-couleur"
                class="form-input"
                value="#1A6B3C"
                style="height: 42px; padding: 4px"
              />
            </div>
          </div>
        </div>
        <div class="modal__pied">
          <button
            onclick="fermerModal('modal-add-concours')"
            class="btn btn--gris"
          >
            Annuler
          </button>
          <button
            onclick="sauvegarderConcours()"
            class="btn btn--primaire"
            id="btn-save-conc"
          >
            <span data-icone="disquette" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span> Sauvegarder
          </button>
        </div>
      </div>
    </div>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>

    <script src="/js/auth.js"></script>

    <script src="/js/main.js"></script>

    <script>
      let tousConcoursAdmin = [];
      let editConcId = null;

      const STATUT_EMOJI_ADMIN = {
        ouvert: "🔴",
        "à venir": "🔵",
        fermé: "⚫",
        résultats: "🏆",
      };
      const STATUT_LABEL_ADMIN = {
        ouvert: "En cours",
        "à venir": "À venir",
        fermé: "Fermé",
        résultats: "Résultats publiés",
      };

      document.addEventListener("DOMContentLoaded", async () => {
        if (!window.Auth?.protegerPageAdmin()) return;
        await charger();
      });

      async function charger() {
        try {
          const data = await window.API.Concours.liste({ limit: 500 });
          tousConcoursAdmin = data.concours || [];
          filtrerConcours();
        } catch (err) {
          window.afficherToast("Erreur : " + err.message, "erreur");
        }
      }

      function filtrerConcours() {
        const rech = document.getElementById("rech-conc").value.toLowerCase();
        const statut = document.getElementById("fil-statut-conc").value;
        const acc = document.getElementById("fil-acc-conc").value;
        const liste = tousConcoursAdmin.filter((c) => {
          if (
            rech &&
            !c.titre.toLowerCase().includes(rech) &&
            !(c.organisme || "").toLowerCase().includes(rech)
          )
            return false;
          if (statut && c.statut !== statut) return false;
          if (acc !== "" && String(c.premium) !== acc) return false;
          return true;
        });
        document.getElementById("compteur-conc").textContent =
          `${liste.length} / ${tousConcoursAdmin.length} concours`;
        const tbody = document.getElementById("tbody-conc");
        if (liste.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--gris-texte);">Aucun résultat</td></tr>`;
          return;
        }
        tbody.innerHTML = liste
          .map(
            (c) => `
    <tr>
      <td style="font-weight:700;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.titre}</td>
      <td style="font-size:0.85rem;">${c.organisme || "—"}</td>
      <td><span class="badge badge--violet" style="font-size:0.7rem;">${c.categorie || "—"}</span></td>
      <td style="font-size:0.82rem;">${STATUT_EMOJI_ADMIN[c.statut] || "📋"} ${STATUT_LABEL_ADMIN[c.statut] || c.statut || "—"}</td>
      <td style="font-size:0.82rem;">${c.cloture || "—"}</td>
      <td style="font-size:0.85rem;">${c.places || "—"}</td>
      <td>${c.premium ? '<span class="badge badge--premium" style="font-size:0.7rem;">⭐</span>' : '<span class="badge badge--gratuit" style="font-size:0.7rem;">🆓</span>'}</td>
      <td><div class="admin-tableau__actions">
        <button class="admin-tableau__btn admin-tableau__btn--edit" onclick="editer(${c.id})">✏️</button>
        <button class="admin-tableau__btn admin-tableau__btn--danger" onclick="supprimer(${c.id},'${(c.titre || "").replace(/'/g, "\\'")}')">🗑️</button>
      </div></td>
    </tr>`,
          )
          .join("");
      }

      function ouvrirAjout() {
        editConcId = null;
        document.getElementById("modal-conc-titre").innerHTML =
          '<span data-icone="plus" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span> Ajouter un concours';
        document.getElementById("conc-titre").value = "";
        document.getElementById("conc-organisme").value = "";
        document.getElementById("conc-categorie").value = "";
        document.getElementById("conc-statut").value = "ouvert";
        document.getElementById("conc-niveau").value = "";
        document.getElementById("conc-ouverture").value = "";
        document.getElementById("conc-cloture").value = "";
        document.getElementById("conc-frais").value = "";
        document.getElementById("conc-places").value = "";
        document.getElementById("conc-conditions").value = "";
        document.getElementById("conc-pieces").value = "";
        document.getElementById("conc-centres").value = "";
        document.getElementById("conc-premium").value = "false";
        document.getElementById("conc-couleur").value = "#1A6B3C";
        ouvrirModal("modal-add-concours");
      }

      function editer(id) {
        const c = tousConcoursAdmin.find((x) => x.id === id);
        if (!c) return;
        editConcId = id;
        document.getElementById("modal-conc-titre").innerHTML =
          '<span data-icone="crayon" data-taille="18" style="display:inline-flex;vertical-align:-3px;"></span> Modifier le concours';
        document.getElementById("conc-titre").value = c.titre || "";
        document.getElementById("conc-organisme").value = c.organisme || "";
        document.getElementById("conc-categorie").value = c.categorie || "";
        document.getElementById("conc-statut").value = c.statut || "ouvert";
        document.getElementById("conc-niveau").value = c.niveau || "";
        document.getElementById("conc-ouverture").value = c.ouverture
          ? String(c.ouverture).slice(0, 10)
          : "";
        document.getElementById("conc-cloture").value = c.cloture
          ? String(c.cloture).slice(0, 10)
          : "";
        document.getElementById("conc-frais").value = c.frais || "";
        document.getElementById("conc-places").value = c.places || "";
        document.getElementById("conc-conditions").value = c.conditions || "";
        document.getElementById("conc-pieces").value = Array.isArray(
          c.pieces,
        )
          ? c.pieces.join(", ")
          : "";
        document.getElementById("conc-centres").value = Array.isArray(
          c.centres,
        )
          ? c.centres.join(", ")
          : "";
        document.getElementById("conc-premium").value = String(
          c.premium || false,
        );
        document.getElementById("conc-couleur").value = c.couleur || "#1A6B3C";
        ouvrirModal("modal-add-concours");
      }

      async function sauvegarderConcours() {
        const payload = {
          titre: document.getElementById("conc-titre").value.trim(),
          organisme: document.getElementById("conc-organisme").value.trim(),
          categorie: document.getElementById("conc-categorie").value.trim(),
          statut: document.getElementById("conc-statut").value,
          niveau: document.getElementById("conc-niveau").value,
          ouverture: document.getElementById("conc-ouverture").value || null,
          cloture: document.getElementById("conc-cloture").value || null,
          frais: parseInt(document.getElementById("conc-frais").value) || 0,
          places:
            parseInt(document.getElementById("conc-places").value) || null,
          conditions: document.getElementById("conc-conditions").value.trim(),
          pieces: document
            .getElementById("conc-pieces")
            .value.split(",")
            .map((s) => s.trim())
            .filter(Boolean),
          centres: document
            .getElementById("conc-centres")
            .value.split(",")
            .map((s) => s.trim())
            .filter(Boolean),
          premium: document.getElementById("conc-premium").value === "true",
          couleur: document.getElementById("conc-couleur").value,
        };
        if (!payload.titre || !payload.organisme || !payload.categorie) {
          window.afficherToast(
            "Titre, organisme et catégorie sont requis.",
            "warn",
          );
          return;
        }
        const btn = document.getElementById("btn-save-conc");
        btn.classList.add("btn--chargement");
        btn.disabled = true;
        try {
          if (editConcId) {
            await window.API.Concours.modifier(editConcId, payload);
            window.afficherToast("Concours modifié !", "succes");
          } else {
            await window.API.Concours.creer(payload);
            window.afficherToast("Concours ajouté !", "succes");
          }
          fermerModal("modal-add-concours");
          editConcId = null;
          await charger();
        } catch (err) {
          window.afficherToast(err.message, "erreur");
        } finally {
          btn.classList.remove("btn--chargement");
          btn.disabled = false;
        }
      }

      async function supprimer(id, titre) {
        if (!confirm(`Supprimer "${titre}" ?`)) return;
        try {
          await window.API.Concours.supprimer(id);
          window.afficherToast("Concours supprimé.", "succes");
          await charger();
        } catch (err) {
          window.afficherToast(err.message, "erreur");
        }
      }
    </script>
  </body>
</html>
