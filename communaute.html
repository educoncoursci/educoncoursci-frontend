<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Communauté — EduConcoursCI</title>
    <meta
      name="description"
      content="Échange avec d'autres candidats aux concours de Côte d'Ivoire : entraide, questions, actualités."
    />
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <style>
      .forum-filtres {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .forum-filtre {
        background: var(--blanc);
        border: 1px solid var(--gris-bordure);
        border-radius: 20px;
        padding: 6px 16px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
      }
      .forum-filtre--actif {
        background: var(--vert);
        color: #fff;
        border-color: var(--vert);
      }
      .forum-sujet {
        background: var(--blanc);
        border-radius: var(--radius-md);
        padding: 16px 18px;
        margin-bottom: 10px;
        box-shadow: var(--ombre-sm);
        display: block;
        text-decoration: none;
        color: inherit;
      }
      .forum-sujet:hover { box-shadow: var(--ombre-md); }
      .forum-tag {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 2px 10px;
        border-radius: 10px;
        margin-right: 6px;
      }
      .forum-tag--general  { background: #e0e7ff; color: #3730a3; }
      .forum-tag--entraide { background: #dcfce7; color: #166534; }
      .forum-tag--question { background: #fef3c7; color: #92400e; }
      .forum-tag--actualite{ background: #fee2e2; color: #991b1b; }
    </style>
  </head>
  <body>
    <div id="site-header"></div>

    <main class="container" style="max-width: 820px; padding: 32px 20px 60px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:20px;">
        <div>
          <h1 style="margin-bottom:4px;">💬 Communauté</h1>
          <p style="color:var(--gris-texte);font-size:0.9rem;">Entraide entre candidats : questions, conseils, actualités.</p>
        </div>
        <button onclick="ouvrirModalSujet()" class="btn btn--primaire">+ Nouveau sujet</button>
      </div>

      <div class="forum-filtres" id="forum-filtres">
        <button class="forum-filtre forum-filtre--actif" data-cat="" onclick="filtrerCategorie('', this)">Tous</button>
        <button class="forum-filtre" data-cat="general" onclick="filtrerCategorie('general', this)">Général</button>
        <button class="forum-filtre" data-cat="entraide" onclick="filtrerCategorie('entraide', this)">Entraide</button>
        <button class="forum-filtre" data-cat="question" onclick="filtrerCategorie('question', this)">Questions</button>
        <button class="forum-filtre" data-cat="actualite" onclick="filtrerCategorie('actualite', this)">Actualités</button>
      </div>

      <div id="liste-sujets">
        <div class="skeleton" style="height: 90px; border-radius: 14px; margin-bottom: 10px;"></div>
        <div class="skeleton" style="height: 90px; border-radius: 14px; margin-bottom: 10px;"></div>
        <div class="skeleton" style="height: 90px; border-radius: 14px;"></div>
      </div>

      <div id="pagination-forum" style="display:flex;justify-content:center;gap:10px;margin-top:20px;"></div>
    </main>

    <!-- Modal nouveau sujet -->
    <div id="modal-sujet" class="modal hidden">
      <div class="modal__contenu">
        <div class="modal__header">
          <h3>Nouveau sujet</h3>
          <button onclick="fermerModal('modal-sujet')" class="modal__fermer">✕</button>
        </div>
        <div class="modal__corps">
          <div id="msg-modal-sujet" class="hidden" style="margin-bottom:14px;"></div>
          <div class="form-groupe">
            <label class="form-label">Catégorie</label>
            <select id="sujet-categorie" class="form-input">
              <option value="general">Général</option>
              <option value="entraide">Entraide</option>
              <option value="question">Question</option>
              <option value="actualite">Actualité</option>
            </select>
          </div>
          <div class="form-groupe">
            <label class="form-label">Titre</label>
            <input type="text" id="sujet-titre" class="form-input" placeholder="Résume ta question ou ton sujet en une phrase" maxlength="200" />
          </div>
          <div class="form-groupe">
            <label class="form-label">Message</label>
            <textarea id="sujet-contenu" class="form-textarea" rows="5" placeholder="Détaille ta question, partage ton expérience…"></textarea>
          </div>
        </div>
        <div class="modal__pied">
          <button onclick="fermerModal('modal-sujet')" class="btn btn--gris">Annuler</button>
          <button onclick="publierSujet()" class="btn btn--primaire" id="btn-publier-sujet">Publier</button>
        </div>
      </div>
    </div>

    <div id="site-footer"></div>

    <script src="/js/layout.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/recherche.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>

    <script>
      let categorieActive = "";
      let pageActuelle = 1;

      const LABELS_CAT = { general: "Général", entraide: "Entraide", question: "Question", actualite: "Actualité" };

      function echapperHtml(texte) {
        const div = document.createElement("div");
        div.textContent = texte || "";
        return div.innerHTML;
      }

      document.addEventListener("DOMContentLoaded", () => chargerSujets());

      function filtrerCategorie(cat, btn) {
        categorieActive = cat;
        pageActuelle = 1;
        document.querySelectorAll(".forum-filtre").forEach((b) => b.classList.remove("forum-filtre--actif"));
        btn.classList.add("forum-filtre--actif");
        chargerSujets();
      }

      async function chargerSujets() {
        const div = document.getElementById("liste-sujets");
        try {
          const params = { page: pageActuelle };
          if (categorieActive) params.categorie = categorieActive;
          const data = await window.API.Forum.sujets(params);

          if (data.sujets.length === 0) {
            div.innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icone">💬</div>
        <div class="empty-state__titre">Aucun sujet pour l'instant</div>
        <p class="empty-state__texte">Sois le premier à lancer une discussion !</p>
      </div>`;
            document.getElementById("pagination-forum").innerHTML = "";
            return;
          }

          div.innerHTML = data.sujets.map(carteSujet).join("");
          afficherPagination(data.page, data.totalPages);
        } catch (err) {
          div.innerHTML = `<p style="color:#dc2626;">Erreur de chargement : ${err.message}</p>`;
        }
      }

      function carteSujet(s) {
        const date = new Date(s.created_at).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
        return `
    <a href="/sujet-detail.html?id=${s.id}" class="forum-sujet">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;">
        <div style="min-width:0;">
          <span class="forum-tag forum-tag--${s.categorie}">${LABELS_CAT[s.categorie] || s.categorie}</span>
          ${s.epingle ? '<span class="forum-tag" style="background:#fde68a;color:#78350f;">📌 Épinglé</span>' : ""}
          ${s.concours_titre ? `<span class="forum-tag" style="background:var(--gris-clair);color:var(--gris-texte);">${echapperHtml(s.concours_titre)}</span>` : ""}
          <div style="font-weight:800;font-size:0.98rem;margin-top:6px;">${echapperHtml(s.titre)}</div>
          <div style="font-size:0.78rem;color:var(--gris-texte);margin-top:4px;">Par ${echapperHtml(s.auteur_nom)} · ${date} · 👁️ ${s.vues}</div>
        </div>
        <div style="text-align:center;flex-shrink:0;">
          <div style="font-weight:800;font-size:1.1rem;color:var(--vert);">${s.nb_reponses}</div>
          <div style="font-size:0.7rem;color:var(--gris-texte);">réponse${s.nb_reponses > 1 ? "s" : ""}</div>
        </div>
      </div>
    </a>`;
      }

      function afficherPagination(page, totalPages) {
        const div = document.getElementById("pagination-forum");
        if (totalPages <= 1) { div.innerHTML = ""; return; }
        div.innerHTML = `
      ${page > 1 ? `<button class="btn btn--gris btn--sm" onclick="allerPage(${page - 1})">← Précédent</button>` : ""}
      <span style="align-self:center;font-size:0.85rem;color:var(--gris-texte);">Page ${page} / ${totalPages}</span>
      ${page < totalPages ? `<button class="btn btn--gris btn--sm" onclick="allerPage(${page + 1})">Suivant →</button>` : ""}`;
      }

      function allerPage(p) {
        pageActuelle = p;
        chargerSujets();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function ouvrirModalSujet() {
        if (!window.Auth?.estConnecte()) {
          window.location.href = "/auth/login.html";
          return;
        }
        document.getElementById("sujet-titre").value = "";
        document.getElementById("sujet-contenu").value = "";
        document.getElementById("sujet-categorie").value = "general";
        document.getElementById("msg-modal-sujet").classList.add("hidden");
        ouvrirModal("modal-sujet");
      }

      async function publierSujet() {
        const titre = document.getElementById("sujet-titre").value.trim();
        const contenu = document.getElementById("sujet-contenu").value.trim();
        const categorie = document.getElementById("sujet-categorie").value;
        const msg = document.getElementById("msg-modal-sujet");
        const btn = document.getElementById("btn-publier-sujet");

        if (titre.length < 5 || contenu.length < 10) {
          msg.className = "alerte alerte--erreur";
          msg.textContent = "Titre trop court (5 car. min) ou message trop court (10 car. min).";
          msg.classList.remove("hidden");
          return;
        }

        btn.disabled = true;
        try {
          const { sujet } = await window.API.Forum.creerSujet({ titre, contenu, categorie });
          fermerModal("modal-sujet");
          window.location.href = `/sujet-detail.html?id=${sujet.id}`;
        } catch (err) {
          msg.className = "alerte alerte--erreur";
          msg.textContent = err.message;
          msg.classList.remove("hidden");
        } finally {
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
