<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courriers et documents — ProInsertion CI</title>
    <meta name="description" content="Lettres de relance, de recommandation, de démission, demandes de congé, rapport de stage, projet professionnel, discours et biographie : rédigés pour vous à l'unité." />
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/recherche.css" />
    <style>
      .doc-groupe { font-weight: 800; color: var(--bleu); margin: 18px 0 8px; font-size: .95rem; }
      .doc-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
      .doc-type { border: 2px solid var(--gris-bordure); border-radius: 12px; padding: 12px 14px; cursor: pointer; background: #fff; }
      .doc-type.selectionne { border-color: var(--vert); background: #f0fdf4; }
      .doc-type__nom { font-weight: 800; font-size: .92rem; }
      .doc-type__desc { font-size: .78rem; color: var(--gris-texte); margin: 4px 0 6px; line-height: 1.4; }
      .doc-type__prix { font-weight: 800; color: var(--vert); }
      .doc-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .doc-form .pleine { grid-column: 1 / -1; }
      @media (max-width: 640px) { .doc-form { grid-template-columns: 1fr; } }
    </style>
      <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A6B3C" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
      <link rel="stylesheet" href="/css/ui-pro.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <div class="page-header" style="background: linear-gradient(135deg, #0a2540, #0a6ebd)">
      <div class="container">
        <h1>Courriers et documents</h1>
        <p>Lettres, demandes, rapports, projets, discours et biographies — rédigés pour vous, payés à l'unité.</p>
      </div>
    </div>

    <main class="container" style="max-width: 900px; padding: 32px 20px 60px;">
      <div id="zone-non-connecte" class="hidden" style="text-align:center; padding:60px 20px;">
        <p style="margin-bottom:16px; color:var(--gris-texte);">Connectez-vous pour commander un document.</p>
        <a href="/auth/login.html" class="btn btn--primaire">Se connecter</a>
      </div>

      <div id="zone-generateur">
        <div style="background: var(--blanc); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--ombre-sm); margin-bottom: 20px;">
          <h3 style="margin:0 0 6px;">1. Choisissez votre document</h3>
          <div id="catalogue-docs" style="color: var(--gris-texte);">Chargement…</div>
        </div>

        <div id="zone-formulaire" class="hidden" style="background: var(--blanc); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--ombre-sm); margin-bottom: 20px;">
          <h3 style="margin:0 0 14px;" id="titre-formulaire">2. Renseignez les informations</h3>
          <div class="doc-form" id="champs-formulaire"></div>
          <button id="btn-generer" class="btn btn--primaire btn--full btn--lg" style="margin-top:20px;">Générer mon document</button>
        </div>

        <div id="zone-commande" class="hidden"></div>

        <div id="zone-mes-docs" class="hidden" style="margin-top:20px;">
          <div style="background: var(--blanc); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--ombre-sm);">
            <h3 style="margin:0 0 12px; font-size:1rem;">Mes documents</h3>
            <div id="liste-mes-docs"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="/js/layout.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/recherche.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/commande.js"></script>
    <script>
      const CATEGORIES_DOCS = ["documents-candidature", "documents-administratifs", "documents-academiques", "entretiens", "accompagnement"];
      let produits = [];      // produits du catalogue (nom, description, prix)
      let definitions = {};   // champs de saisie par identifiant
      let choisi = null;

      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      document.addEventListener("DOMContentLoaded", async () => {
        if (!window.Auth?.estConnecte()) {
          document.getElementById("zone-non-connecte").classList.remove("hidden");
          document.getElementById("zone-generateur").classList.add("hidden");
          return;
        }
        const session = window.Auth.getSession();
        Commande.monter(document.getElementById("zone-commande"), { nomFichier: () => (document.getElementById("f-nom")?.value || "").replace(/\s+/g, "_").replace(/[^a-zA-Z0-9_]/g, "") || "document" });
        document.getElementById("btn-generer").onclick = generer;
        document.addEventListener("commande:maj", chargerMesDocs);
        await chargerCatalogue();
        chargerMesDocs();
        window.__session = session;
      });

      async function chargerCatalogue() {
        const zone = document.getElementById("catalogue-docs");
        try {
          const [cat, defs] = await Promise.all([
            fetch(window.API_URL + "/catalogue").then((r) => r.json()),
            fetch(window.API_URL + "/cv/redaction/types").then((r) => r.json()),
          ]);
          definitions = Object.fromEntries((defs.types || []).map((t) => [t.id, t]));
          const groupes = (cat.categories || []).filter((c) => CATEGORIES_DOCS.includes(c.id));
          produits = groupes.flatMap((g) => g.produits).filter((p) => definitions[p.id]);
          if (!produits.length) { zone.textContent = "Ces documents ne sont pas disponibles pour le moment."; return; }
          zone.innerHTML = groupes.map((g) => {
            const liste = g.produits.filter((p) => definitions[p.id]);
            if (!liste.length) return "";
            return `<div class="doc-groupe">${esc(g.nom)}</div><div class="doc-grille">` + liste.map((p) => `
              <div class="doc-type" data-id="${esc(p.id)}">
                <div class="doc-type__nom">${esc(p.nom)}</div>
                <div class="doc-type__desc">${esc(p.description)}</div>
                <div class="doc-type__prix">${Number(p.prix_fcfa).toLocaleString("fr-FR")} FCFA</div>
              </div>`).join("") + `</div>`;
          }).join("");
          zone.querySelectorAll(".doc-type").forEach((c) => (c.onclick = () => choisir(c.dataset.id)));
        } catch {
          zone.textContent = "Impossible de charger les documents. Réessayez dans un instant.";
        }
      }

      function choisir(id) {
        choisi = id;
        document.querySelectorAll(".doc-type").forEach((c) => c.classList.toggle("selectionne", c.dataset.id === id));
        const def = definitions[id];
        const produit = produits.find((p) => p.id === id);
        document.getElementById("titre-formulaire").textContent = "2. Renseignez les informations — " + (produit?.nom || def.titre);
        const s = window.Auth.getSession() || {};
        const pre = { nom: s.nom, email: s.email };
        document.getElementById("champs-formulaire").innerHTML = def.champs.map((c) => {
          const attrs = `id="f-${esc(c.id)}" class="form-${c.type === "textarea" ? "textarea" : "input"}" placeholder="${esc(c.placeholder || "")}"`;
          const champ = c.type === "textarea"
            ? `<textarea ${attrs} rows="4"></textarea>`
            : `<input ${attrs} type="text" value="${esc(pre[c.id] || "")}" />`;
          return `<div class="form-groupe ${c.type === "textarea" ? "pleine" : ""}"><label class="form-label">${esc(c.label)}${c.requis ? " <span>*</span>" : ""}</label>${champ}</div>`;
        }).join("");
        document.getElementById("zone-formulaire").classList.remove("hidden");
        document.getElementById("zone-formulaire").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      async function generer() {
        if (!choisi) return;
        const def = definitions[choisi];
        const data = { type: choisi };
        for (const c of def.champs) data[c.id] = document.getElementById("f-" + c.id).value.trim();
        const manquants = def.champs.filter((c) => c.requis && !data[c.id]).map((c) => c.label);
        if (manquants.length) { window.afficherToast("Champs requis : " + manquants.join(", "), "warn"); return; }

        const btn = document.getElementById("btn-generer");
        btn.classList.add("btn--chargement"); btn.disabled = true; btn.textContent = "⏳ Rédaction en cours…";
        try {
          const res = await window.API.CVLM.creerCommande(data);
          Commande.afficher(res.commande);
          chargerMesDocs();
          window.afficherToast("Votre document est prêt. Voici l'aperçu.", "succes");
        } catch (e) {
          window.afficherToast(e.message || "Erreur de génération.", "erreur");
        } finally {
          btn.classList.remove("btn--chargement"); btn.disabled = false; btn.textContent = "Générer mon document";
        }
      }

      function chargerMesDocs() {
        Commande.lister(document.getElementById("zone-mes-docs"), document.getElementById("liste-mes-docs"), ["doc-", "cv-correction", "cv-optimisation-offre", "entretien-preparation"]);
      }
    </script>
  </body>
</html>
