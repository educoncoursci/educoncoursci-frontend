<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages — EduConcoursCI</title>
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <style>
      .msg-layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 16px;
        height: 70vh;
        min-height: 480px;
      }
      @media (max-width: 780px) {
        .msg-layout { grid-template-columns: 1fr; height: auto; }
        .msg-fil.msg-fil--cachee-mobile { display: none; }
      }
      .msg-liste, .msg-fil {
        background: var(--blanc);
        border-radius: var(--radius-lg);
        box-shadow: var(--ombre-sm);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .msg-conv {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--gris-bordure);
        cursor: pointer;
      }
      .msg-conv:hover { background: var(--gris-clair); }
      .msg-conv--active { background: rgba(26,107,60,0.08); }
      .msg-bulle {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 14px;
        margin-bottom: 10px;
        font-size: 0.88rem;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .msg-bulle--moi { margin-left: auto; background: var(--vert); color: #fff; border-radius: 14px 14px 4px 14px; }
      .msg-bulle--autre { background: var(--gris-clair); border-radius: 14px 14px 14px 4px; }
      .msg-badge-non-lu {
        background: var(--vert); color: #fff; font-size: 0.7rem; font-weight: 700;
        border-radius: 10px; padding: 1px 7px; flex-shrink: 0;
      }
    </style>
  </head>
  <body style="background: var(--gris-clair)">
    <div id="site-header"></div>

    <main class="container" style="max-width: 980px; padding: 28px 20px 60px;">
      <h1 style="margin-bottom:16px;">💌 Messages</h1>

      <div class="msg-layout">
        <div class="msg-liste" id="msg-liste">
          <div style="padding:16px;"><div class="skeleton" style="height:60px;border-radius:10px;margin-bottom:10px;"></div><div class="skeleton" style="height:60px;border-radius:10px;"></div></div>
        </div>

        <div class="msg-fil msg-fil--cachee-mobile" id="msg-fil">
          <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--gris-texte);font-size:0.9rem;text-align:center;padding:20px;">
            Sélectionne une conversation pour l'ouvrir.
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="/js/layout.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>

    <script>
      let session = null;
      let conversationActive = null;

      function echapperHtml(texte) {
        const div = document.createElement("div");
        div.textContent = texte || "";
        return div.innerHTML;
      }

      document.addEventListener("DOMContentLoaded", async () => {
        session = window.Auth?.getSession();
        if (!session) { window.location.href = "/auth/login.html"; return; }

        await chargerConversations();

        // Ouverture directe depuis un lien externe (ex: forum) : ?avec=<userId>
        const params = new URLSearchParams(window.location.search);
        const avecId = params.get("avec");
        if (avecId) {
          try {
            const { conversation } = await window.API.Messages.demarrer(avecId);
            await ouvrirConversation(conversation.id);
            await chargerConversations();
          } catch (err) {
            window.afficherToast(err.message, "erreur");
          }
        }
      });

      async function chargerConversations() {
        const div = document.getElementById("msg-liste");
        try {
          const { conversations } = await window.API.Messages.conversations();
          if (conversations.length === 0) {
            div.innerHTML = `
      <div style="padding:24px 16px;text-align:center;color:var(--gris-texte);font-size:0.85rem;">
        Aucune conversation. Tu peux en démarrer une depuis un sujet de la <a href="/communaute.html">communauté</a>.
      </div>`;
            return;
          }
          div.innerHTML = conversations.map((c) => `
      <div class="msg-conv ${conversationActive === c.id ? "msg-conv--active" : ""}" onclick="ouvrirConversation(${c.id})">
        <div style="min-width:0;">
          <div style="font-weight:700;font-size:0.88rem;">${echapperHtml(c.autre_nom)}</div>
          <div style="font-size:0.78rem;color:var(--gris-texte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;">${echapperHtml(c.dernier_message || "Nouvelle conversation")}</div>
        </div>
        ${c.non_lus > 0 ? `<span class="msg-badge-non-lu">${c.non_lus}</span>` : ""}
      </div>`).join("");
        } catch (err) {
          div.innerHTML = `<p style="color:#dc2626;padding:16px;">Erreur : ${err.message}</p>`;
        }
      }

      async function ouvrirConversation(id) {
        conversationActive = id;
        document.getElementById("msg-fil").classList.remove("msg-fil--cachee-mobile");
        document.querySelectorAll(".msg-liste .msg-conv").forEach((el) => el.classList.remove("msg-conv--active"));

        const fil = document.getElementById("msg-fil");
        fil.innerHTML = `<div style="padding:16px;"><div class="skeleton" style="height:40px;border-radius:10px;"></div></div>`;

        try {
          const { messages, autre } = await window.API.Messages.detail(id);
          fil.innerHTML = `
      <div style="padding:14px 18px;border-bottom:1px solid var(--gris-bordure);font-weight:700;display:flex;align-items:center;gap:8px;">
        <button onclick="fermerFil()" class="btn btn--gris btn--sm" style="display:none;" id="btn-retour-liste">←</button>
        ${echapperHtml(autre.nom)}
      </div>
      <div id="msg-corps" style="flex:1;overflow-y:auto;padding:16px 18px;"></div>
      <div style="padding:12px 16px;border-top:1px solid var(--gris-bordure);display:flex;gap:8px;">
        <input type="text" id="msg-input" class="form-input" placeholder="Écris un message…" onkeydown="if(event.key==='Enter') envoyerMsg(${id})">
        <button onclick="envoyerMsg(${id})" class="btn btn--primaire btn--sm">Envoyer</button>
      </div>`;

          const corps = document.getElementById("msg-corps");
          corps.innerHTML = messages.map((m) => `
      <div class="msg-bulle ${m.expediteur_id === session.id ? "msg-bulle--moi" : "msg-bulle--autre"}">${echapperHtml(m.contenu)}</div>`).join("");
          corps.scrollTop = corps.scrollHeight;

          if (window.innerWidth <= 780) {
            document.getElementById("btn-retour-liste").style.display = "inline-flex";
          }

          await chargerConversations(); // rafraîchit les badges non-lus
        } catch (err) {
          fil.innerHTML = `<p style="color:#dc2626;padding:16px;">Erreur : ${err.message}</p>`;
        }
      }

      function fermerFil() {
        document.getElementById("msg-fil").classList.add("msg-fil--cachee-mobile");
      }

      async function envoyerMsg(conversationId) {
        const input = document.getElementById("msg-input");
        const contenu = input.value.trim();
        if (!contenu) return;
        input.value = "";
        try {
          await window.API.Messages.envoyer(conversationId, contenu);
          await ouvrirConversation(conversationId);
        } catch (err) {
          window.afficherToast(err.message, "erreur");
        }
      }
    </script>
  </body>
</html>
